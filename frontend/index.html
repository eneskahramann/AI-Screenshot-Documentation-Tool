<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kılavuz Paneli</title>
  <!-- CSS Dosyasını Bağlıyoruz -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-group">
    <label>Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
  </div>

  <div class="form-group">
    <label>Ekran Başlığı (İsteğe Bağlı):</label>
    <input type="text" id="title" placeholder="Örn: Aidat Liste Ekranı">
  </div>

  <div class="form-group">
    <label>Yapay Zeka Modeli:</label>
    <select id="aiModel">
      <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
      <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
      <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
    </select>
  </div>

  <div class="btn-group">
    <button id="captureBtn">📸 Ekranı Yakala</button>
    <button id="finishBtn">💾 Bitir & Word Üret</button>
  </div>

  <div id="gallery-container">
    <ul id="screen-list"></ul>
  </div>

  <div id="logArea">Hazır. İşlem bekleniyor...</div>

  <!-- JavaScript Dosyasını Bağlıyoruz -->
  <script src="renderer.js"></script>
</body>
</html>
