<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kılavuz Paneli</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }
    #captureBtn {
      background-color: #2874A6;
    }
    #captureBtn:hover {
      background-color: #1A5276;
    }
    #finishBtn {
      background-color: #239B56;
    }
    #finishBtn:hover {
      background-color: #1D8348;
    }
    #logArea {
      margin-top: 15px;
      padding: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      height: 60px;
      overflow-y: auto;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="form-group">
    <label>Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">
  </div>

  <div class="form-group">
    <label>Ekran Başlığı (İsteğe Bağlı):</label>
    <input type="text" id="title" placeholder="Örn: Aidat Liste Ekranı">
  </div>

  <div class="form-group">
    <label>Yapay Zeka Modeli:</label>
    <select id="aiModel">
      <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
      <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
      <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
    </select>
  </div>

  <div class="btn-group">
    <button id="captureBtn">📸 Ekranı Yakala</button>
    <button id="finishBtn">💾 Bitir & Word Üret</button>
  </div>

  <div id="logArea">Hazır. İşlem bekleniyor...</div>

  <script>
    const { ipcRenderer } = require('electron');

    const apiKeyInput = document.getElementById('apiKey');
    const titleInput = document.getElementById('title');
    const aiModelSelect = document.getElementById('aiModel');
    const captureBtn = document.getElementById('captureBtn');
    const finishBtn = document.getElementById('finishBtn');
    const logArea = document.getElementById('logArea');

    // Kayıtlı API anahtarı varsa otomatik doldur
    if (localStorage.getItem('geminiApiKey')) {
      apiKeyInput.value = localStorage.getItem('geminiApiKey');
    }

    captureBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        logArea.innerHTML = "❌ Hata: API Key girmelisiniz!";
        return;
      }
      
      // API Key'i tarayıcı hafızasına kaydet (bir sonraki açılış için)
      localStorage.setItem('geminiApiKey', key);
      
      // Bilgileri arka plana gönder
      ipcRenderer.send('capture-screen', {
        apiKey: key,
        title: titleInput.value.trim(),
        modelName: aiModelSelect.value // Seçilen modeli de gönderiyoruz
      });
      
      titleInput.value = ''; // İşlem sonrası başlığı temizle
    });

    finishBtn.addEventListener('click', () => {
      ipcRenderer.send('finish-manual');
    });

    ipcRenderer.on('log', (event, message) => {
      logArea.innerHTML = message;
    });
  </script>
</body>
</html>
